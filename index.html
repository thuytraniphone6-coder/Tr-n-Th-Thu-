<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Profile - Trần Thị Thuỳ</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
}

.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.2);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    color: white;
}

.header {
    text-align: center;
}

.avatar {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 4px solid white;
}

/* ảnh minh họa nhỏ */
.icon-img {
    width: 40px;
    vertical-align: middle;
    margin-right: 8px;
}

/* gallery */
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.gallery img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 10px;
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.1);
}

/* section */
.section {
    margin-top: 25px;
}

.section h2 {
    border-left: 5px solid white;
    padding-left: 10px;
}

.tag {
    display: inline-block;
    background: rgba(255,255,255,0.3);
    padding: 6px 12px;
    margin: 5px;
    border-radius: 15px;
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <img class="avatar" src="https://i.imgur.com/placeholder.png">
        <h1>Trần Thị Thuỳ</h1>
        <p>Lớp 12C1</p>
    </div>

    <!-- GIỚI THIỆU -->
    <div class="section">
        <h2>
            <img class="icon-img" src="https://cdn-icons-png.flaticon.com/512/847/847969.png">
            Giới thiệu
        </h2>
        <p>
            Mình là học sinh lớp 12, yêu thích sáng tạo và đang định hướng theo ngành kinh doanh.
            Mình luôn cố gắng phát triển bản thân mỗi ngày.
        </p>
    </div>

    <!-- MỤC TIÊU -->
    <div class="section">
        <h2>
            <img class="icon-img" src="https://cdn-icons-png.flaticon.com/512/190/190411.png">
            Mục tiêu
        </h2>
        <p>Quản trị kinh doanh - UEL</p>
    </div>

    <!-- SỞ THÍCH -->
    <div class="section">
        <h2>
            <img class="icon-img" src="https://cdn-icons-png.flaticon.com/512/833/833472.png">
            Sở thích
        </h2>
        <div class="tag">🎬 Xem phim</div>
        <div class="tag">🎧 Nghe nhạc</div>
        <div class="tag">✈️ Du lịch</div>
    </div>

    <!-- KỸ NĂNG -->
    <div class="section">
        <h2>
            <img class="icon-img" src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png">
            Kỹ năng
        </h2>
        <p>Chỉnh sửa ảnh</p>
    </div>

    <!-- GALLERY ẢNH -->
    <div class="section">
        <h2>📸 Hình ảnh của mình</h2>

        <div class="gallery">
           <img src="IMG_1088.jpg">
        </div>
    </div>

</div>

</body>
</html>
